name: Documentation portal

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/pages/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/pages/requirements.txt
      - run: python -m pip install -r tools/pages/requirements.txt
      - run: npm ci --prefix tools/pages --ignore-scripts
      - run: npm run build --prefix tools/pages
      - run: npm run format:check --prefix tools/pages
      - run: python tools/pages/build.py
      - run: python -m unittest discover -s tools/pages/tests -p 'test_*.py'
      - run: python tools/pages/check.py
      - run: npx playwright install --with-deps chromium
        working-directory: tools/pages
      - run: npm run test:browser --prefix tools/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
