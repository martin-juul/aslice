name: C++ foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 22 format, analysis, build, and tests
        run: docker build --build-arg ASLICE_SANITIZERS=${{ matrix.sanitizers }} -t aslice-check .
      - name: Demonstrations
        run: |
          docker run --rm --network none --entrypoint sh aslice-check /src/tools/demo-prototype.sh
          docker run --rm --network none --entrypoint python3 aslice-check /src/tools/demo-slice.py /build/aslice
      - name: Simulator fixture evidence
        run: |
          mkdir -p build/simulator-evidence
          docker run --rm --network none -v "$PWD/build/simulator-evidence:/evidence" --entrypoint python3 aslice-check -m tools.simulator run --suite fixture --workspace /evidence --seed 17 --aslice /build/aslice-simulator
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-linux-sanitizers-${{ matrix.sanitizers }}
          path: build/simulator-evidence/evidence
      - name: Simulator helper evidence
        run: |
          mkdir -p build/helper-simulator-evidence
          docker run --rm --network none -v "$PWD/build/helper-simulator-evidence:/evidence" --entrypoint python3 aslice-check -m tools.simulator run --suite helper --workspace /evidence --aslice /build/aslice-simulator --helper-driver /build/simulator_helper_driver
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-helper-linux-sanitizers-${{ matrix.sanitizers }}
          path: build/helper-simulator-evidence/evidence
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python mingw-w64-x86_64-clang-tools-extra
            mingw-w64-x86_64-clang mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zstd mingw-w64-x86_64-nlohmann-json
      - name: Native MinGW build and tests
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
      - name: Analyze Windows compilation database
        run: cmake --build build/native --target tidy
      - name: Portable demonstration
        run: python tools/demo-slice.py build/native/aslice.exe
      - name: Simulator fixture evidence
        run: python -m tools.simulator run --suite fixture --workspace build/simulator-evidence --seed 17 --aslice build/native/aslice-simulator.exe
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-windows
          path: build/simulator-evidence/evidence
      - name: Simulator helper evidence
        run: python -m tools.simulator run --suite helper --workspace build/helper-simulator-evidence --aslice build/native/aslice-simulator.exe --helper-driver build/native/simulator_helper_driver.exe
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-helper-windows
          path: build/helper-simulator-evidence/evidence
  documentation:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/check_docs.py
      - run: python tests/check_contracts.py
      - run: python -m tools.simulator coverage --gate development --output build/requirement-coverage.json
      - run: python -m unittest discover -s tests -p test_requirements.py
      - run: python -m unittest discover -s tests -p test_docs.py
